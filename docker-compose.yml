# Môi trường local. Chuẩn bị: copy .env.example thành .env rồi điền giá trị.
# Chỉ chạy hạ tầng để debug API từ IDE: docker compose up -d postgres redis rabbitmq mailpit aspire-dashboard
services:
  postgres:
    image: postgres:16-alpine
    container_name: tickethub_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tickethub}
    ports:
      # Cổng host 5433: tránh đụng PostgreSQL cài sẵn trên máy (thường chiếm 5432).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tickethub_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Hàng đợi tin nhắn (Ticket 5). Trang quản lý: http://localhost:15672 (đăng nhập bằng RABBITMQ_USER/RABBITMQ_PASSWORD)
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tickethub_rabbitmq
    environment:
      # Không dùng guest/guest: RabbitMQ chỉ cho guest đăng nhập từ localhost, container api sẽ bị từ chối.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tickethub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tickethub}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Hộp thư giả cho máy dev: nhận mọi email qua SMTP cổng 1025, không gửi ra ngoài thật.
  # Xem thư tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34
    container_name: tickethub_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Xem trace/metrics tại http://localhost:18888 (OTLP nhận ở cổng 18889 trong mạng compose)
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: tickethub_aspire_dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickethub_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tickethub};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Smtp__Host: mailpit
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-tickethub}:${RABBITMQ_PASSWORD:-tickethub}@rabbitmq:5672
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (>= 32 chars)}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: TicketHub.Api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
